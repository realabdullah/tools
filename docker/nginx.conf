server {
  # Traefik terminates TLS and forwards here, so no privileged port is needed.
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Behind a reverse proxy: no per-asset access log noise.
  access_log off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # The app talks to nothing, embeds nothing and is never framed. Tool contents
  # must not leak through a referrer either.
  include /etc/nginx/snippets/security-headers.conf;

  location = /healthz {
    include /etc/nginx/snippets/security-headers.conf;
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Hashed filenames: safe to cache for a year.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Source maps are not built for production, but never serve one if that changes.
  location ~* \.map$ {
    return 404;
  }

  # SPA fallback: /jwt, /base64 and anything future resolve to the shell.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
