server {
  # Traefik terminates TLS and forwards here; 8080 needs no privileged port.
  listen 8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Behind a reverse proxy, so no access log noise for asset requests.
  access_log off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # The app is client-side only: it talks to nothing, embeds nothing and is
  # never framed. Tool contents must not leak through a referrer either.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # Hashed filenames: safe to cache for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Source maps are built but should not be served to the public.
  location ~* \.map$ {
    return 404;
  }

  # SPA fallback: /jwt, /base64 and anything future resolve to the shell.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
