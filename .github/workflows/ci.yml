name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  image:
    name: Build and publish image
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      # Built and checked before it is published: a broken SPA fallback or a
      # missing asset should never reach the registry.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: tools:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          set -euo pipefail
          docker run -d --name tools-smoke -p 8080:8080 tools:smoke
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null && break
            sleep 1
          done

          echo "healthz"
          test "$(curl -fsS http://127.0.0.1:8080/healthz)" = "ok"

          echo "SPA fallback serves the shell for a deep link"
          curl -fsS http://127.0.0.1:8080/jwt | grep -q '<div id="root">'

          echo "unknown asset paths still 404 rather than returning HTML"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/assets/nope.js)" = "404"

          echo "security headers survive per-location add_header"
          curl -sS -D - -o /dev/null http://127.0.0.1:8080/jwt | grep -qi 'content-security-policy'

          docker rm -f tools-smoke

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  deploy:
    name: Tell Dokploy to pull
    needs: image
    runs-on: ubuntu-latest
    steps:
      # Dokploy redeploys from its own webhook. The URL is infrastructure, not
      # source: set DOKPLOY_DEPLOY_WEBHOOK as a repository secret. Without it
      # this step is a no-op and the image simply waits to be pulled.
      - name: Trigger redeploy
        env:
          WEBHOOK: ${{ secrets.DOKPLOY_DEPLOY_WEBHOOK }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "DOKPLOY_DEPLOY_WEBHOOK is not set — skipping redeploy trigger."
            echo "The image is published; deploy it from Dokploy, or add the secret."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$WEBHOOK"
